<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>matchline — デモページ</title>
  </head>
  <body>
    <div class="demo-page">
      <header class="demo-header">
        <div>
          <h1>matchline デモ</h1>
          <p class="demo-subtitle">
            依存ゼロ・Vanilla TypeScript製 トーナメント表ライブラリ（チームパス強調・ラウンドナビ・複数セットスコア・LIVE・3位決定戦）
          </p>
        </div>
        <div class="demo-controls">
          <label class="demo-control">
            <span>規模</span>
            <select id="size-select">
              <option value="8">8チーム（準々決勝〜）</option>
              <option value="16">16チーム（1回戦〜）</option>
              <option value="20">20チーム（BYE自動配置）</option>
              <option value="32">32チーム（5ラウンド）</option>
              <option value="64">64チーム（6ラウンド）</option>
            </select>
          </label>
          <label class="demo-control">
            <span>テーマ</span>
            <select id="theme-select">
              <option value="light">ライト</option>
              <option value="dark">ダーク</option>
              <option value="emerald">エメラルド</option>
            </select>
          </label>
          <label class="demo-control">
            <span>接続線</span>
            <select id="connector-select">
              <option value="orthogonal">直角</option>
              <option value="curved">曲線</option>
            </select>
          </label>
          <label class="demo-control">
            <span>パス強調</span>
            <select id="highlight-trigger-select">
              <option value="click">クリック</option>
              <option value="hover">ホバー</option>
            </select>
          </label>
          <label class="demo-control">
            <span>表示ラウンド数</span>
            <select id="visible-rounds-select">
              <option value="all">すべて</option>
              <option value="3">3ラウンド</option>
              <option value="2">2ラウンド</option>
              <option value="1">1ラウンド</option>
            </select>
          </label>
          <button id="live-update-btn" type="button">決勝スコアをLIVE更新</button>
        </div>
      </header>

      <main class="demo-stage" id="bracket-stage">
        <div id="bracket-root"></div>
      </main>

      <section class="demo-editor" aria-label="試合スケジュール編集・チーム検索">
        <h2>選択中の試合のコート・開始時間を変更 / チーム検索</h2>
        <div class="demo-editor-row">
          <span id="selected-match-label" class="demo-editor-target">対象: 決勝 (m7)</span>
          <label class="demo-control">
            <span>コート</span>
            <input id="venue-input" type="text" list="venue-presets" value="センターコート" placeholder="例: 第3コート" />
            <datalist id="venue-presets">
              <option value="第1コート"></option>
              <option value="第2コート"></option>
              <option value="第3コート"></option>
              <option value="センターコート"></option>
              <option value="第1体育館 A面"></option>
            </datalist>
          </label>
          <label class="demo-control">
            <span>開始時間</span>
            <input id="time-input" type="text" value="17:00" placeholder="例: 14:30" />
          </label>
          <button id="apply-schedule-btn" type="button">反映する</button>

          <span class="demo-editor-divider" aria-hidden="true"></span>

          <label class="demo-control">
            <span>チーム検索</span>
            <input id="team-search-input" type="text" placeholder="例: チーム1 / 東京" />
          </label>
          <button id="team-search-btn" type="button" class="demo-btn-secondary">フォーカス</button>
        </div>
      </section>

      <section class="demo-log" aria-live="polite">
        <h2>イベントログ（チーム行をクリックすると勝ち上がりパスが強調されます）</h2>
        <p id="click-log">試合カードまたはチーム行をクリックすると、ここに詳細が表示されます。</p>
      </section>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
