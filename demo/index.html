<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>matchline — デモページ</title>
  </head>
  <body>
    <div class="demo-page">
      <header class="demo-header">
        <div>
          <h1>matchline デモ</h1>
          <p class="demo-subtitle">
            依存ゼロ・Vanilla TypeScript製 トーナメント表ライブラリ（チームパス強調・ラウンドナビ・複数セットスコア・LIVE・3位決定戦）
          </p>
        </div>
        <div class="demo-controls">
          <label class="demo-control">
            <span>テーマ</span>
            <select id="theme-select">
              <option value="light">ライト</option>
              <option value="dark">ダーク</option>
              <option value="emerald">エメラルド</option>
            </select>
          </label>
          <label class="demo-control">
            <span>接続線</span>
            <select id="connector-select">
              <option value="orthogonal">直角</option>
              <option value="curved">曲線</option>
            </select>
          </label>
          <label class="demo-control">
            <span>パス強調</span>
            <select id="highlight-trigger-select">
              <option value="click">クリック</option>
              <option value="hover">ホバー</option>
            </select>
          </label>
          <label class="demo-control">
            <span>表示ラウンド数</span>
            <select id="visible-rounds-select">
              <option value="all">すべて</option>
              <option value="2">2ラウンド</option>
              <option value="1">1ラウンド</option>
            </select>
          </label>
          <button id="live-update-btn" type="button">決勝スコアをLIVE更新</button>
        </div>
      </header>

      <main class="demo-stage" id="bracket-stage">
        <div id="bracket-root"></div>
      </main>

      <section class="demo-log" aria-live="polite">
        <h2>イベントログ（チーム行をクリックすると勝ち上がりパスが強調されます）</h2>
        <p id="click-log">試合カードまたはチーム行をクリックすると、ここに詳細が表示されます。</p>
      </section>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
