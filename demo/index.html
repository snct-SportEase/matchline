<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>matchline — デモページ</title>
  </head>
  <body>
    <div class="demo-page">
      <header class="demo-header">
        <div>
          <h1>matchline デモ</h1>
          <p class="demo-subtitle">
            依存ゼロ・Vanilla TypeScript製 トーナメント表ライブラリ（チームパス強調・ラウンドナビ・複数セットスコア・LIVE・3位決定戦）
          </p>
        </div>
        <div class="demo-controls">
          <label class="demo-control">
            <span>規模</span>
            <select id="size-select">
              <option value="8">8チーム（準々決勝〜）</option>
              <option value="16">16チーム（1回戦〜）</option>
              <option value="20">20チーム（BYE自動配置）</option>
              <option value="32">32チーム（5ラウンド）</option>
              <option value="64">64チーム（6ラウンド）</option>
            </select>
          </label>
          <label class="demo-control">
            <span>表示ラウンド数</span>
            <select id="visible-rounds-select">
              <option value="all">すべて</option>
              <option value="auto">自動（レスポンシブ）</option>
              <option value="3">3ラウンド</option>
              <option value="2">2ラウンド</option>
              <option value="1">1ラウンド</option>
            </select>
          </label>
          <button id="live-update-btn" type="button">決勝スコアをLIVE更新</button>
        </div>
      </header>

      <main class="demo-stage" id="bracket-stage">
        <div id="bracket-root"></div>
      </main>

      <section class="demo-search" aria-label="チーム検索">
        <div class="demo-search-row">
          <label class="demo-control">
            <span>チーム検索</span>
            <input id="team-search-input" type="text" placeholder="例: 東京 / チーム1" />
          </label>
          <button id="team-search-btn" type="button">フォーカス</button>
        </div>
      </section>

      <section class="demo-log" aria-live="polite">
        <h2>イベントログ（チーム行をクリックすると勝ち上がりパスが強調されます）</h2>
        <p id="click-log">試合カードまたはチーム行をクリックすると、ここに詳細が表示されます。</p>
      </section>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
